# Reusable Moodle plugin CI, based on moodle-plugin-ci's gha.dist.yml.
#
# Call it from a plugin repository's .github/workflows/moodle-ci.yml:
#
#   jobs:
#     ci:
#       uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
#
# See README.md for the inputs.
name: Moodle Plugin CI

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON list of {moodle-branch, php, database} cells; database is pgsql, mariadb or mysqli. The default
          covers Moodle 5.1 to 5.3 LTS plus Moodle main. MOODLE_500_STABLE is left out of the default: pass your
          own matrix if the plugin still supports Moodle 5.0.
        type: string
        default: >-
          [
            {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "pgsql"},
            {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "mariadb"},
            {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "pgsql"},
            {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "pgsql"},
            {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mariadb"},
            {"moodle-branch": "main", "php": "8.4", "database": "pgsql"}
          ]
      phplint-php:
        description: PHP version that runs the syntax check (the lowest PHP in the matrix).
        type: string
        default: '8.2'
      grunt-branch:
        description: Moodle branch that runs the Grunt check (the branch AMD builds are made on).
        type: string
        default: MOODLE_501_STABLE
      behat:
        description: Run the Behat features.
        type: boolean
        default: true
      behat-tags:
        description: Only run Behat scenarios with these tags, e.g. "@local_myplugin". Empty runs them all.
        type: string
        default: ''
      timezone:
        description: Time zone for the test runs.
        type: string
        default: Australia/Sydney
      extra-plugins:
        description: >-
          Other plugins to install alongside this one (dependencies), one per line as "owner/repo" or
          "owner/repo@branch". Private repositories need the extra-plugins-token secret.
        type: string
        default: ''
      apt-packages:
        description: Ubuntu packages to install before the run, space separated, e.g. "poppler-utils".
        type: string
        default: ''
      phpmd-blocking:
        description: Fail the build on PHP Mess Detector findings. By default they are only reported.
        type: boolean
        default: false
      audit-blocking:
        description: >-
          Fail the build when composer audit finds a known vulnerability in moodle-plugin-ci's own packages. By
          default those are only reported as a warning, because they can only be fixed upstream. A vulnerability
          in the plugin's own composer.lock always fails the build.
        type: boolean
        default: false
      timeout-minutes:
        description: Stop a matrix cell that runs longer than this, so a hung test can't use up Actions minutes.
        type: number
        default: 90
    secrets:
      extra-plugins-token:
        description: Token that can read the private repositories listed in extra-plugins.
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Moodle main is the next (unreleased) version: report it, but don't block on it.
    continue-on-error: ${{ matrix.moodle-branch == 'main' }}

    env:
      TZ: ${{ inputs.timezone }}

    services:
      # Each cell starts only the database it uses; an empty image skips the service.
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mysql:
        image: ${{ matrix.database == 'mysqli' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: plugin
          persist-credentials: false

      - name: Install Ubuntu packages
        if: ${{ inputs.apt-packages != '' }}
        run: |
          sudo apt-get update -q
          # The package list is word-split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $APT_PACKAGES
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      # Packagist and GitHub downloads occasionally fail on the runners, so try up to three times.
      - name: Initialise moodle-plugin-ci
        id: init
        run: |
          for attempt in 1 2 3; do
            if composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not download moodle-plugin-ci after 3 attempts."
              exit 1
            fi
            echo "::warning::Downloading moodle-plugin-ci failed (attempt $attempt of 3); retrying in $((attempt * 30)) seconds."
            rm -rf ci
            sleep $((attempt * 30))
          done
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      # Each plugin is cloned into moodle-plugin-ci-plugins/, which the install step picks up. The token goes to git
      # as an HTTP header through environment-only config, never in a URL, so error output can't print it.
      - name: Add extra plugins
        if: ${{ inputs.extra-plugins != '' }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          while read -r entry; do
            [ -z "$entry" ] && continue
            repo=${entry%@*}
            url="https://github.com/${repo}.git"
            if [ "$repo" != "$entry" ]; then
              moodle-plugin-ci add-plugin --clone "$url" --branch "${entry#*@}"
            else
              moodle-plugin-ci add-plugin --clone "$url"
            fi
          done <<< "$EXTRA_PLUGINS"
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
          TOKEN: ${{ secrets.extra-plugins-token || github.token }}

      # The install downloads Moodle, Composer and npm packages and Node.js, any of which can fail for reasons that
      # have nothing to do with the plugin, so it's tried up to three times. A failed attempt leaves a Moodle checkout,
      # its data directory and its database behind, and the next attempt would stop on them, so they're removed
      # first. The plugin itself is copied into Moodle, not moved, so ./plugin is untouched.
      - name: Install moodle-plugin-ci
        id: install
        run: |
          for attempt in 1 2 3; do
            if moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::The install failed 3 times. Its log above shows why; the later checks were skipped."
              exit 1
            fi
            echo "::warning::The install failed (attempt $attempt of 3); retrying in $((attempt * 30)) seconds."
            rm -rf moodle moodledata
            if [ "$DB" = pgsql ]; then
              psql -h 127.0.0.1 -U postgres -c 'DROP DATABASE IF EXISTS moodle;' || true
            else
              mysql -h 127.0.0.1 -u root -e 'DROP DATABASE IF EXISTS moodle;' || true
            fi
            sleep $((attempt * 30))
          done
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # Every check below needs a working install, so none of them runs if it failed: the install step's own log
      # is then the only failure, rather than each check also failing with 'Not enough arguments (missing: "plugin")'.

      # Lint once, on the lowest supported PHP: the syntax check doesn't vary by Moodle branch or database.
      - name: PHP Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.php == inputs.phplint-php }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: ${{ !inputs.phpmd-blocking }} # Reported only, unless phpmd-blocking is set.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpmd

      # moodle-plugin-ci always uses the plain "moodle" standard, so pass the plugin's own ruleset when it has one
      # (e.g. a proprietary plugin excluding the GPL boilerplate sniff).
      - name: Moodle Code Checker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ -f plugin/.phpcs.xml ]; then
            moodle-plugin-ci phpcs --max-warnings 0 --standard="$GITHUB_WORKSPACE/plugin/.phpcs.xml"
          else
            moodle-plugin-ci phpcs --max-warnings 0
          fi

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci mustache

      # Known vulnerabilities in the CI tooling, checked once (on the PHP Lint cell): the result doesn't vary by
      # Moodle branch or database. It doesn't need the Moodle install, only the moodle-plugin-ci download.
      - name: Composer audit
        if: ${{ !cancelled() && steps.init.outcome == 'success' && matrix.php == inputs.phplint-php }}
        run: |
          status=0
          # Abandoned packages are listed but don't fail: moodle-plugin-ci ships one, and it isn't a vulnerability.
          if ! composer audit --working-dir=ci --abandoned=report; then
            if [ "$AUDIT_BLOCKING" = true ]; then
              echo "::error::composer audit found known vulnerabilities in moodle-plugin-ci's packages."
              status=1
            else
              echo "::warning::composer audit found known vulnerabilities in moodle-plugin-ci's packages (see the" \
                "Composer audit step). They need a moodle-plugin-ci release to fix, so this is only a warning."
            fi
          fi
          # The plugin's own locked packages are the plugin's to fix, so these always fail.
          if [ -f plugin/composer.lock ]; then
            if ! composer audit --working-dir=plugin --locked --abandoned=report; then
              echo "::error::composer audit found known vulnerabilities in the plugin's composer.lock."
              status=1
            fi
          fi
          exit "$status"
        env:
          AUDIT_BLOCKING: ${{ inputs.audit-blocking }}

      # Grunt only runs on the branch AMD builds are made on; other branches can minify differently.
      - name: Grunt
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.moodle-branch == inputs.grunt-branch }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.behat }}
        run: |
          if [ -n "$BEHAT_TAGS" ]; then
            moodle-plugin-ci behat --profile chrome --scss-deprecations --auto-rerun 3 --tags="$BEHAT_TAGS"
          else
            moodle-plugin-ci behat --profile chrome --scss-deprecations --auto-rerun 3
          fi
        env:
          BEHAT_TAGS: ${{ inputs.behat-tags }}

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Behat Faildump (${{ matrix.moodle-branch }}, ${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
