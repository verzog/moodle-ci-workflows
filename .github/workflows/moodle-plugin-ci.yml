# Reusable Moodle plugin CI, based on moodle-plugin-ci's gha.dist.yml.
#
# Call it from a plugin repository's .github/workflows/moodle-ci.yml:
#
#   jobs:
#     ci:
#       uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
#
# See README.md for the inputs.
name: Moodle Plugin CI

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON list of {moodle-branch, php, database} cells. The default covers Moodle 5.1 to 5.3 LTS plus
          Moodle main. MOODLE_500_STABLE and older are deliberately left out: plugins require Moodle 5.1 or later.
        type: string
        default: >-
          [
            {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "pgsql"},
            {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "mariadb"},
            {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "pgsql"},
            {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "pgsql"},
            {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mariadb"},
            {"moodle-branch": "main", "php": "8.4", "database": "pgsql"}
          ]
      phplint-php:
        description: PHP version that runs the syntax check (the lowest PHP in the matrix).
        type: string
        default: '8.2'
      grunt-branch:
        description: Moodle branch that runs the Grunt check (the branch AMD builds are made on).
        type: string
        default: MOODLE_501_STABLE
      behat:
        description: Run the Behat features.
        type: boolean
        default: true
      behat-tags:
        description: Only run Behat scenarios with these tags, e.g. "@local_myplugin". Empty runs them all.
        type: string
        default: ''
      timezone:
        description: Time zone for the test runs.
        type: string
        default: Australia/Sydney

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # Moodle main is the next (unreleased) version: report it, but don't block on it.
    continue-on-error: ${{ matrix.moodle-branch == 'main' }}

    env:
      TZ: ${{ inputs.timezone }}

    services:
      # Each cell starts only the database it uses; an empty image skips the service.
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # Lint once, on the lowest supported PHP: the syntax check doesn't vary by Moodle branch or database.
      - name: PHP Lint
        if: ${{ !cancelled() && matrix.php == inputs.phplint-php }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      # Grunt only runs on the branch AMD builds are made on; other branches can minify differently.
      - name: Grunt
        if: ${{ !cancelled() && matrix.moodle-branch == inputs.grunt-branch }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() && inputs.behat }}
        run: |
          if [ -n "$BEHAT_TAGS" ]; then
            moodle-plugin-ci behat --profile chrome --scss-deprecations --auto-rerun 3 --tags="$BEHAT_TAGS"
          else
            moodle-plugin-ci behat --profile chrome --scss-deprecations --auto-rerun 3
          fi
        env:
          BEHAT_TAGS: ${{ inputs.behat-tags }}

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ matrix.moodle-branch }}, ${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
